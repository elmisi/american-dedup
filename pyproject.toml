[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "american-dedup"
version = "1.0.0"
description = "A TUI application for finding and managing duplicate files using fdupes"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "Alessandro" }
]
keywords = ["duplicates", "fdupes", "tui", "file-management", "deduplication"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: System :: Filesystems",
    "Topic :: Utilities",
]
dependencies = [
    "textual>=0.40.0",
]

[project.urls]
Homepage = "https://github.com/alessandro/american-dedup"
Repository = "https://github.com/alessandro/american-dedup"
Issues = "https://github.com/alessandro/american-dedup/issues"

[project.scripts]
american-dedup = "american_dedup.app:main"

[tool.hatch.build.targets.wheel]
packages = ["american_dedup"]
